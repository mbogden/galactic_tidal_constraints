[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "galactic_tidal_constraints"
version = "0.1.0"
description = "Galaxy collision simulation, scoring and optimization around SPAM"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jspam @ git+https://github.com/mbogden/JSPAM.git@ee3abbf54808ce7efb83402b87b07f0b1e72dfc3",
    "numpy",
]

[dependency-groups]
dev = ["pytest"]
notebook = ["jupyterlab", "matplotlib"]  # uv sync --group notebook

[tool.hatch.metadata]
allow-direct-references = true  # lets the jspam dependency point at a git commit

[tool.hatch.build.targets.wheel]
packages = ["src/galactic_tidal_constraints"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["slow: long tests; skip them with -m 'not slow'"]
