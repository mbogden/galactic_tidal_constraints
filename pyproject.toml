[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "galactic_tidal_constraints"
version = "0.1.0"
description = "Galaxy collision simulation, scoring and optimization around SPAM"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jspam @ git+https://github.com/mbogden/JSPAM.git@9b11eae44be38204510ed6af4d5111b3f564446f",
    "numpy",
]

[dependency-groups]
dev = ["pytest", {include-group = "tng"}]  # the tng group too, so its tests always run
notebook = ["jupyterlab", "matplotlib"]  # uv sync --group notebook
mpi = ["mpi4py"]  # uv sync --group mpi; for simr --mode mpi; needs an MPI library (mpicc)
tng = ["h5py"]  # uv sync --group tng; for the TNG readers (tng.py)

[tool.uv]
no-binary-package = ["mpi4py"]  # built from source, so it links to the installed MPI (OpenMPI 4.1.6)

[tool.hatch.metadata]
allow-direct-references = true  # lets the jspam dependency point at a git commit

[tool.hatch.build.targets.wheel]
packages = ["src/galactic_tidal_constraints"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["slow: long tests; skip them with -m 'not slow'"]
